name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }}, MCP v2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked runtime and test dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-build-isolation --no-deps -e .
      - name: Release and plugin contract
        run: python scripts/validate-release-contract.py
      - name: Public tool context budget
        run: python scripts/audit_tokens.py --json
      - name: Ruff lint
        run: ruff check .
      - name: Run tests
        run: pytest -q

  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install hash-locked test environment
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-build-isolation --no-deps -e .
      - name: Create temporary emulator configuration
        run: >-
          node -e "require('node:fs').writeFileSync(
          process.env.RUNNER_TEMP + '/steam-mcp-firebase.json',
          JSON.stringify({emulators:{firestore:{host:'127.0.0.1',port:8085}}}))"
      - name: Firestore state transition and restart test
        env:
          GOOGLE_CLOUD_PROJECT: demo-steam-mcp
        run: >-
          npx --yes firebase-tools@15.28.2
          --config "$RUNNER_TEMP/steam-mcp-firebase.json"
          emulators:exec --only firestore --project demo-steam-mcp
          "python -m pytest -q tests/test_cloud_jobs.py::test_firestore_emulator_idempotency_transition_and_restart_recovery"
